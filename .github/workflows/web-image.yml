# Builds the web app on GitHub's machines and publishes it as a small nginx
# image, ghcr.io/<owner>/nizan_crm-web. The server never builds: a deploy
# (`ssh crm deploy`) only downloads this image. See deploy/README.md.
name: Web image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to main replaces a build still running for an older one.
concurrency:
  group: web-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The API address is baked in at build time (lib/providers/dio_provider.dart);
      # without it the site points at localhost and hangs on the loading screen.
      - name: Check .env.production
        run: grep -qE '^API_BASE_URL=https://' .env.production || { echo "::error::.env.production needs API_BASE_URL=https://..."; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --dart-define-from-file=.env.production

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main is published as :latest, so what the server pulls is always
      # what main says. A manual run on another branch builds but pushes nothing.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
