# nginx inside the nizan-crm-web container. Not the host's: on the VPS only
# TeamN's Caddy listens on 80/443; it does TLS and gzip and forwards here.
#
# Flutter web file names are not content-hashed, so everything is "revalidate
# every time" (cheap: a 304 by ETag). Without this, browsers keep an old build.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    etag on;

    location / {
        add_header Cache-Control "no-cache";
        # Single-page app: a refresh on any screen must get index.html.
        try_files $uri $uri/ /index.html;
    }
}
